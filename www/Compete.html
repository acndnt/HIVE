(function(){

  function fit(){
    var W = window.innerWidth, H = window.innerHeight, k = W / 390;

    var h = H / k, x = Math.max(0, (W - 390 * k) / 2);
    document.documentElement.style.setProperty('--appH', h + 'px');
    r.style.height = h + 'px';
    r.style.transform = 'translate(' + x + 'px,0) scale(' + k + ')';
  }
  fit();
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', function(){ setTimeout(fit, 120); });
})();

else if (e.key === 'Enter' && t && t.getAttribute && (t.hasAttribute('data-af') || t.hasAttribute('data-gf') || t.hasAttribute('data-ddf') || t.hasAttribute('data-igf') || t.hasAttribute('data-ckf')) && t.tagName === 'INPUT') { e.preventDefault(); t.blur(); }
else if (e.key === 'Enter' && t && t.getAttribute && t.getAttribute('data-in') === 'mnew') { e.preventDefault(); this.addMilestone(); this.save(); this.hydrate(); } });
root.addEventListener('input', (e) => {
const t = e.target, k = t && t.getAttribute && t.getAttribute('data-in'), f = t && t.getAttribute && t.getAttribute('data-remf');
if (k) { this.store().txt[k] = t.value; this.save(); this.hydrate(); }
if (f) { const r = this.remCur(); if (r) { r[f] = t.value; this.save(); this.hydrate(); } }
const tf = t && t.getAttribute && t.getAttribute('data-taskf'), sf = t && t.getAttribute && t.getAttribute('data-statf'), st = this.store();
if (tf) { const x = st.tasks.filter((y) => y.id === st.txt.tCur)[0]; if (x) { x[tf] = t.value; this.save(); this.hydrate(); } }
const df = t && t.getAttribute && t.getAttribute('data-ddf'), af = t && t.getAttribute && t.getAttribute('data-af'), xf = t && t.getAttribute && t.getAttribute('data-sf'), gf = t && t.getAttribute && t.getAttribute('data-gf'), mf = t && t.getAttribute && t.getAttribute('data-mf');
if (df) { this.setDream(this.curId(), df, t.value); this.save(); this.hydrate(); }
if (af) { const x = this.actCur(); if (x) { x[af] = t.value; this.save(); this.hydrate(); } }
if (xf) { const x = this.stratCur(); if (x) { x[xf] = t.value; this.save(); this.hydrate(); } }
if (gf) { const x = this.goalRec(); if (x) { x[gf] = (gf === 't' || gf === 'unit') ? t.value : (t.value === '' ? '' : +t.value); if (gf === 'cur') x.curSet = 1; if (gf === 'start' && !x.curSet) x.cur = x.start === '' ? 0 : x.start; this.save(); this.hydrate(); } }
const mef = t && t.getAttribute && t.getAttribute('data-mef');
if (mef) { st.me[mef] = t.value; this.save(); this.hydrate(); }
const igf = t && t.getAttribute && t.getAttribute('data-igf'), ckf = t && t.getAttribute && t.getAttribute('data-ckf');
if (igf) { const x = this.igCur(); if (x) { x.t = t.value; this.save(); this.hydrate(); } }
if (ckf) { const x = this.goalRec(), c = x && x.checks ? x.checks[st.num.ckCur || 1] : null; if (c) { c[ckf] = ckf === 'note' ? t.value : (t.value === '' ? '' : +t.value); this.save(); this.hydrate(); } }
if (mf) { const x = this.msCur(); if (x) { x[0] = t.value; this.save(); this.hydrate(); } }
if (sf) { const k = st.txt.stCur || 'PHY'; st.stats[k] = Object.assign({}, st.stats[k], { [sf]: sf === 'code' ? t.value.toUpperCase().slice(0, 4) : t.value }); this.save(); this.hydrate(); }
});
root.addEventListener('scroll', (e) => { const st = e.target; if (st && st.hasAttribute && st.hasAttribute('data-strip')) this.stripLabel(st); }, true);
this.pullInit(root);
this.navInit(root);
root.addEventListener('change', (e) => {
// a chosen photo is cropped to a square and shrunk before it is kept, so it fits in local storage
const t = e.target;
if (!t || !t.hasAttribute || !t.hasAttribute('data-photo') || !t.files || !t.files[0]) return;
const fr = new FileReader();
fr.onload = () => {
const img = new Image();
img.onload = () => {
const N = 240, c = document.createElement('canvas'), k = Math.min(img.width, img.height);
c.width = N; c.height = N;
c.getContext('2d').drawImage(img, (img.width - k) / 2, (img.height - k) / 2, k, k, 0, 0, N, N);
try { this.store().me.photo = c.toDataURL('image/jpeg', 0.85); } catch (err) {}
this.save(); this.hydrate();
};
img.src = fr.result;
};
fr.readAsDataURL(t.files[0]);
t.value = '';
});
this.swipeInit(root);
}
this.addMount();
this.hydrate();
}
addInit(btn) {
if (!btn || btn._addBound) return;
btn._addBound = true;
btn.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); if (!this._root) this.mount(btn.closest('[data-root]')); if (btn.getAttribute('aria-expanded') === 'true') this.closeSheets(); else this.openAdd(btn.getAttribute('data-add-type') || 'act'); });
}
addMount() { const b = (this._root || document).querySelector('[data-add]'); if (b) this.addInit(b); }
tint(c, a) {
const m = /^#([0-9a-f]{6})$/i.exec(c || '');
if (!m) return c;
const n = parseInt(m[1], 16);
return 'rgba(' + (n >> 16) + ', ' + ((n >> 8) & 255) + ', ' + (n & 255) + ', ' + a + ')';
}
theme() {
let a = this.props.accent ?? '#FF5C7A', b = this.props.accent2 ?? '#FFA24D';
const th = this.themes()[this.store().ch.theme], hx = this.store().txt.themeHex;
if (hx) { a = hx; b = this.partner(hx); } else if (th) { a = th[0]; b = th[1]; }
if (!this._addRef) this._addRef = (el) => this.addInit(el);
if (!this._rootRef) this._rootRef = (el) => { if (el) this.mount(el); };
return { addRef: this._addRef, rootRef: this._rootRef, meshc: this.mix(a), deep: this.shade(a), band: this.shade(a, 0.42), accent: a, accent2: b, grad: 'linear-gradient(135deg, ' + a + ' 0%, ' + b + ' 100%)', glow: this.tint(a, 0.45), wash: this.tint(a, 0.26), soft: this.tint(a, 0.16) };
}
componentDidMount() { this.mount(); }
componentDidUpdate() { this.hydrate(); }
renderVals() {
return this.theme();
}
}

(function(){
  var tpl = document.getElementById('tpl').textContent;
  var c = new Component(); window.__c = c;
  var v = c.renderVals();
  var fill = function(){ return tpl.replace(/\{\{\s*([\w.]+)\s*\}\}/g, function(m, k){ return typeof v[k] === 'function' ? '' : String(v[k] == null ? '' : v[k]); }); };
  var wire = function(){
    Array.prototype.slice.call(document.querySelectorAll('[data-ref]')).forEach(function(el){ var f = v[el.getAttribute('data-ref')]; if (typeof f === 'function') f(el); });
    Array.prototype.slice.call(document.querySelectorAll('[data-onclick]')).forEach(function(el){ el.addEventListener('click', function(e){ var f = v[el.getAttribute('data-onclick')]; if (typeof f === 'function') f(e); }); });
  };
  var root = document.getElementById('root');
  root.innerHTML = fill();
  window.__apply = function(){
    var prev = v; v = c.renderVals();
    if (v.accent !== prev.accent || v.grad !== prev.grad) { root.innerHTML = fill(); c._el = null; c._root = null; wire(); if (c.componentDidMount) c.componentDidMount(); return; }
    if (c.layers && v.pan !== prev.pan) c.layers().forEach(function(l){ l.style.transform = v.pan; });
    if (c.componentDidUpdate) c.componentDidUpdate();
  };
  wire();
  if (c.componentDidMount) c.componentDidMount();
})();
</script>
<script>
(function(){
  var C = window.Capacitor;
  if (!C || !C.isNativePlatform || !C.isNativePlatform()) return;
  var P = C.Plugins || {};
  try { if (P.StatusBar) P.StatusBar.setStyle({ style: 'DARK' }); } catch (e) {}
  try { if (P.SplashScreen) P.SplashScreen.hide(); } catch (e) {}
  document.addEventListener('click', function(e){
    var t = e.target && e.target.closest ? e.target.closest('[data-act]') : null;
    if (!t || !P.Haptics) return;
    var a = t.getAttribute('data-act') || '';
    try { if (/^(tick|msinc|gstep|gdone|cksave)/.test(a)) P.Haptics.impact({ style: 'LIGHT' }); } catch (err) {}
  }, true);
  var LN = P.LocalNotifications;
  if (!LN) return;
  var KEY = 'hexhive.fresh.v1', timer = null, last = '';
  var about = { act: 'Time for today\u2019s DAILY ACTIONS.', task: 'Your stat tasks are waiting.', focus: 'Check in on the dreams you\u2019re tracking.', review: 'Take two minutes to review your day.' };
  function sync(){
    var s = {}; try { s = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
    var rems = (s.rem || []).filter(function(r){ return r && r.on; });
    var sig = JSON.stringify(rems); if (sig === last) return; last = sig;
    var list = [];
    rems.forEach(function(r, i){
      var t = String(r.time || '09:00').split(':'), h = +t[0] || 0, m = +t[1] || 0;
      (r.days || []).forEach(function(on, d){
        if (!on) return;
        list.push({ id: 1000 + i * 10 + d, title: r.t || 'Reminder', body: about[r.about] || about.act,
          schedule: { on: { weekday: d === 6 ? 1 : d + 2, hour: h, minute: m }, repeats: true, allowWhileIdle: true } });
      });
    });
    LN.getPending().then(function(p){
      var old = (p && p.notifications || []).map(function(n){ return { id: n.id }; });
      return old.length ? LN.cancel({ notifications: old }) : null;
    }).then(function(){
      if (!list.length) return null;
      return LN.checkPermissions().then(function(st){ return st.display === 'granted' ? st : LN.requestPermissions(); }).then(function(st){
        if (st.display === 'granted') return LN.schedule({ notifications: list });
      });
    }).catch(function(){ last = ''; });
  }
  var set = localStorage.setItem.bind(localStorage);
  localStorage.setItem = function(k, val){ set(k, val); if (k === KEY) { clearTimeout(timer); timer = setTimeout(sync, 600); } };
  setTimeout(sync, 800);
})();
</script>
