name: Build iOS app
on: workflow_dispatch
jobs:
  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash scripts/build-ios.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Hive-ipa
          path: Hive-unsigned.ipa
